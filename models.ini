; llama-turboq in-process model swap registry
; loaded by the server with: --models-preset /home/jack/llm/llama-turboq/models.ini
;
; Each section is a model name accepted by:
;   POST /models/load                        { "model": "<section>" }
;   POST /v1/chat/completions  (lazy swap)   { "model": "<section>" }
;
; Presets are applied on top of the server's CLI defaults, so only the keys
; that differ from the CLI must be listed here. Model-specific keys
; (spec-type, KV type, mmproj, ...) MUST be explicit per section because
; stale values from a previously loaded model would otherwise linger.
;
; Note: sampling defaults (--temp, --min-p, ...) have no env keys and cannot
; be expressed in INI - clients should pass them per request.

; [*] = global preset, cascaded into every section below
[*]
LLAMA_ARG_CTX_SIZE=262144
LLAMA_ARG_N_PARALLEL=1
LLAMA_ARG_N_GPU_LAYERS=99
LLAMA_ARG_FLASH_ATTN=on
LLAMA_ARG_JINJA=true
LLAMA_ARG_HOST=0.0.0.0

; Qwopus 3.6 27B - production model, fork-native MTP + TurboQuant TBQ4 KV
[qwopus-27b]
LLAMA_ARG_MODEL=/home/jack/llm/models/Qwopus3.6-27B-v2-MTP-Q4_K_M.gguf
LLAMA_ARG_ALIAS=qwopus-27b,qwopus,qwopus3.6-27b-v2-mtp,qwopus3.6-27b-turboq
LLAMA_ARG_SPEC_TYPE=mtp
LLAMA_ARG_SPEC_DRAFT_N_MAX=3
LLAMA_ARG_CACHE_TYPE_K=tbq4_0
LLAMA_ARG_CACHE_TYPE_V=tbq4_0
LLAMA_ARG_REASONING=on
LLAMA_ARG_THINK_BUDGET=8192

; Qwen 3.6 27B dense (no MTP head), fork-native MTP works on this arch too,
; but the stock file is served plain to match the historical config
[qwen35-dense]
LLAMA_ARG_MODEL=/home/jack/llm/models/Qwen_Qwen3.6-27B-Q4_K_M.gguf
LLAMA_ARG_ALIAS=qwen35-dense,qwen-qwen3.6-27b-q4_k_m,qwen3.6-27b-dense
LLAMA_ARG_SPEC_TYPE=none
LLAMA_ARG_CACHE_TYPE_K=tbq4_0
LLAMA_ARG_CACHE_TYPE_V=tbq4_0
LLAMA_ARG_CACHE_RAM=8192
LLAMA_ARG_REASONING=on

; Qwen 3.6 27B pi-reasoning, MTP-capable GGUF
[qwen35-pi-reasoning]
LLAMA_ARG_MODEL=/home/jack/llm/models/Qwen3.6-27B-MTP-pi-reasoning-Q4_K_M.gguf
LLAMA_ARG_ALIAS=qwen35-pi-reasoning,qwen35-pi,qwen3.6-27b-pi-reasoning
LLAMA_ARG_SPEC_TYPE=mtp
LLAMA_ARG_SPEC_DRAFT_N_MAX=3
LLAMA_ARG_CACHE_TYPE_K=tbq4_0
LLAMA_ARG_CACHE_TYPE_V=tbq4_0
LLAMA_ARG_CACHE_RAM=8192
LLAMA_ARG_REASONING=on
LLAMA_ARG_THINK_BUDGET=8192

; Qwen 3.6 35B A3B MoE - no nextn_predict_layers in GGUF, MTP would fail.
; 22GB of weights alone leave no room for the 262K window; capped at 32K ctx.
[qwen35-moe]
LLAMA_ARG_MODEL=/home/jack/llm/models/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
LLAMA_ARG_ALIAS=qwen35-moe,qwen3.6-35b-a3b-ud,qwen3.6-35b-a3b
LLAMA_ARG_SPEC_TYPE=none
LLAMA_ARG_CTX_SIZE=32768
LLAMA_ARG_CACHE_TYPE_K=tbq4_0
LLAMA_ARG_CACHE_TYPE_V=tbq4_0
LLAMA_ARG_BATCH=4096
LLAMA_ARG_UBATCH=1024
LLAMA_ARG_CACHE_RAM=8192
LLAMA_ARG_REASONING=on

; Qwen 3.6 27B vanilla with MTP head trained in-file (unsloth GGUF).
; Same footprint as qwopus; fork-native MTP if nextn_predict_layers is present
; in the GGUF (verify with: gguf reader on general.* and qwen35.nextn_predict_layers)
[qwen36-27b-mtp]
LLAMA_ARG_MODEL=/home/jack/llm/models/Qwen3.6-27B-Q4_K_M.gguf
LLAMA_ARG_ALIAS=qwen36-27b-mtp,qwen3.6-27b-mtp
LLAMA_ARG_SPEC_TYPE=mtp
LLAMA_ARG_SPEC_DRAFT_N_MAX=3
LLAMA_ARG_CACHE_TYPE_K=tbq4_0
LLAMA_ARG_CACHE_TYPE_V=tbq4_0
; ubatch 256 (vs default 512) shrinks the MTP shadow context's compute
; buffers enough to fit next to the 17.1GB trunk + 4.3GB KV at 262K
LLAMA_ARG_UBATCH=256
LLAMA_ARG_REASONING=on
LLAMA_ARG_THINK_BUDGET=8192

; Ornith-1.0-9B - agentic coding model (SWE-bench 69.4), qwen35 arch.
; Small enough that the full 262K window leaves ~14GB of VRAM headroom.
; NOTE: spec-type mtp only if nextn_predict_layers is in the GGUF
[ornith-9b]
LLAMA_ARG_MODEL=/home/jack/llm/models/ornith-1.0-9b-Q4_K_M.gguf
LLAMA_ARG_ALIAS=ornith-9b,ornith-1.0-9b
LLAMA_ARG_SPEC_TYPE=none
LLAMA_ARG_CACHE_TYPE_K=tbq4_0
LLAMA_ARG_CACHE_TYPE_V=tbq4_0
LLAMA_ARG_REASONING=on

; Ornith-1.0-35B - qwen35moe, unsloth Dynamic IQ4_XS. 30 full-attn layers
; -> 262K KV ~4GB at 4-bit; q8_0 KV would not fit (8GB). Plain decode.
[ornith-35b]
LLAMA_ARG_MODEL=/home/jack/llm/models/Ornith-1.0-35B-UD-IQ4_XS.gguf
LLAMA_ARG_ALIAS=ornith-35b,ornith-1.0-35b
LLAMA_ARG_SPEC_TYPE=none
LLAMA_ARG_CACHE_TYPE_K=tbq4_0
LLAMA_ARG_CACHE_TYPE_V=tbq4_0
LLAMA_ARG_REASONING=on
LLAMA_ARG_THINK_BUDGET=8192

; Gemma 4 31B - IQ4_XS + TBQ4 KV. Full 262K is 350MB over the 24GB budget
; (KV 5.5GB + weights 15.6GB + ~2.4GB fixed compute buffers), so ctx is capped
; at 204800. Plain decode (fork MTP is qwen35-only).
[gemma4-31b]
LLAMA_ARG_MODEL=/home/jack/llm/models/gemma-4-31B-it-IQ4_XS.gguf
LLAMA_ARG_ALIAS=gemma4-31b,gemma-4-31b
LLAMA_ARG_SPEC_TYPE=none
LLAMA_ARG_CTX_SIZE=204800
LLAMA_ARG_BATCH=512
LLAMA_ARG_UBATCH=128
LLAMA_ARG_CACHE_TYPE_K=q4_0
LLAMA_ARG_CACHE_TYPE_V=q4_0
LLAMA_ARG_REASONING=on
LLAMA_ARG_THINK_BUDGET=16384

; Gemma 4 12B - fork MTP supports qwen35 arches only, plain decoding
[gemma4-12b-q4]
LLAMA_ARG_MODEL=/home/jack/llm/models/gemma-4-12B-it-Q4_K_M.gguf
LLAMA_ARG_ALIAS=gemma4-12b-q4,gemma4-q4
LLAMA_ARG_SPEC_TYPE=none
LLAMA_ARG_N_PARALLEL=4
LLAMA_ARG_CTX_SIZE=1048576
LLAMA_ARG_CACHE_TYPE_K=q8_0
LLAMA_ARG_CACHE_TYPE_V=q8_0
LLAMA_ARG_REASONING=on

[gemma4-12b-q8]
LLAMA_ARG_MODEL=/home/jack/llm/models/gemma-4-12b-it-Q8_0.gguf
LLAMA_ARG_ALIAS=gemma4-12b-q8,gemma4-q8
LLAMA_ARG_SPEC_TYPE=none
LLAMA_ARG_N_PARALLEL=3
LLAMA_ARG_CTX_SIZE=786432
LLAMA_ARG_CACHE_TYPE_K=q8_0
LLAMA_ARG_CACHE_TYPE_V=q8_0
LLAMA_ARG_REASONING=on
LLAMA_ARG_THINK_BUDGET=16384
