name: Release

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create new release'
        required: true
        type: boolean
        default: true
      tag:
        description: 'Release tag (e.g. b10)'
        required: true
        type: string
  push:
    tags:
      - 'b*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.tag.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Create source archive
        run: |
          git archive --format=tar.gz -o llama-turboq-${{ steps.tag.outputs.name }}-source.tar.gz \
            --prefix=llama-turboq-${{ steps.tag.outputs.name }}/ HEAD

      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: llama-turboq-${{ steps.tag.outputs.name }}-source.tar.gz

  build-ubuntu:
    runs-on: ubuntu-22.04
    needs: source
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DGGML_NATIVE=OFF \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --config Release -j $(nproc)

      - name: Pack binary tarball
        run: |
          mkdir -p package/bin
          cp build/bin/llama-server build/bin/llama-bench build/bin/llama-cli package/bin/
          cp LICENSE package/
          tar -czvf llama-turboq-${{ needs.source.outputs.tag }}-ubuntu-x64.tar.gz \
            --transform "s,^package,llama-turboq-${{ needs.source.outputs.tag }}/," \
            -C package .

      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-x64
          path: llama-turboq-${{ needs.source.outputs.tag }}-ubuntu-x64.tar.gz

  deb:
    runs-on: ubuntu-22.04
    needs: source
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DGGML_NATIVE=OFF \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --config Release -j $(nproc)

      - name: Build .deb package
        run: |
          cd build
          cpack -G DEB

      - name: Rename .deb
        run: |
          mv build/llama-turboq-*.deb llama-turboq-${{ needs.source.outputs.tag }}-ubuntu-x64.deb

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: llama-turboq-${{ needs.source.outputs.tag }}-ubuntu-x64.deb

  create-release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release == 'true' || startsWith(github.ref, 'refs/tags/b') }}
    runs-on: ubuntu-slim
    permissions:
      contents: write
    needs:
      - source
      - build-ubuntu
      - deb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage release files
        run: |
          mkdir -p release
          find artifacts -type f -exec mv {} release/ \;

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.source.outputs.tag }}
          name: llama-turboq ${{ needs.source.outputs.tag }}
          body: |
            Pre-built binaries for Ubuntu x64 (CPU).

            **Includes:**
            - `llama-server` — HTTP server with OpenAI-compatible API
            - `llama-cli` — CLI inference tool
            - `llama-bench` — Benchmark utility
            - Shared libraries (`libllama.so`, `libggml*.so`)

            **Downloads:**
            - [Source](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ needs.source.outputs.tag }}/llama-turboq-${{ needs.source.outputs.tag }}-source.tar.gz)
            - [Ubuntu x64 binary](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ needs.source.outputs.tag }}/llama-turboq-${{ needs.source.outputs.tag }}-ubuntu-x64.tar.gz)
            - [Ubuntu x64 .deb](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ needs.source.outputs.tag }}/llama-turboq-${{ needs.source.outputs.tag }}-ubuntu-x64.deb)
          files: |
            release/*
